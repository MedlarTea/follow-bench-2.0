name: multiRobots
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # The CARLA client wheel ships with the simulator and must match its build.
      # Install it after creating the env (see docs/01_install.md):
      #   pip install "$CARLA_ROOT"/PythonAPI/carla/dist/carla-0.9.16-cp310-cp310-linux_x86_64.whl
      - numpy==1.26.4
      - pillow==10.4.0
      - pygame==2.6.1
      - pyzmq==27.1.0
      - opencv-python==4.8.1.78
      - imageio==2.35.1
      - future==1.0.0
      - networkx==3.4.2
      - Shapely==2.1.2
      - matplotlib==3.10.9
      - open3d==0.19.0
      # --- RDA planner deps ---
      - cvxpy==1.5.2
      - pathos==0.3.4
      - scipy==1.11.4
      - osqp==1.1.1
      - scikit-learn==1.4.2
      - filterpy==1.4.5        # Kalman filter for cvkf trajectory predictor (rda_traj / rda_search)
      # --- YOLO / tracker deps (rda_depth_tpt planner) ---
      - ultralytics==8.4.41
      - lap==0.5.13
      # --- Target ReID (deep appearance recovery for *_tpt planners) ---
      # torch / torchvision are pulled in transitively by ultralytics, but the
      # ReID extractor in followbench/perception/reid_model imports
      # them directly, so we pin known-good versions for reproducibility.
      - torch==2.11.0
      - torchvision==0.26.0
      # --- KPR / deep-person-reid backbone (rda_perception planner, mode='kpr') ---
      # All bundled torchreid imports require these. The two github-only deps
      # have no PyPI release, so they're listed below the pip install block.
      - timm
      - yacs
      - omegaconf
      - albumentations==1.3.1
      - tabulate
      - h5py
      - torchmetrics
      - monai
      - tensorboard
      - wandb
      - deepdiff
      - gdown
      # KPR ReID (vendored deep_person_reid) extra runtime deps:
      - segment_anything                 # imported transitively via torchreid.models.sam
      - cosine_annealing_warmup @ git+https://github.com/katsura-jp/pytorch-cosine-annealing-with-warmup
      # --- TrackVLA end-to-end planner (Qwen3-4B + SigLIP + DINOv3) ---
      - transformers==5.7.0
      - peft==0.19.1
      - tokenizers==0.22.2
      - accelerate==1.13.0
      # --- OA-VAT planner (YOLOe + ORTrack + DINOv3 ReID + PID) ---
      # ORTrack uses timm (already listed above for KPR) and these extras:
      - tensorboardX        # ORTrack train/admin stubs imported at tracker load time
      - jpeg4py             # ORTrack data loader (imported transitively even at inference)
      - easydict            # ORTrack config reader
      # YOLOe text prompts need OpenAI CLIP's tokenizer. Without it ultralytics
      # pip-installs it from GitHub at the first OA-VAT run (minutes; fails offline
      # and then silently falls back to class-index filtering).
      - ftfy==6.3.1
      - clip @ git+https://github.com/ultralytics/CLIP.git@7ffa84b3bfa40c42ecc1c77147a855e69cb2dd40
